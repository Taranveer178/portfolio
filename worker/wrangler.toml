name = "taranveer-blog-api"
main = "src/index.js"
compatibility_date = "2026-11-17"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://taranveer.in,https://www.taranveer.in"

[[d1_databases]]
binding = "DATABASE"
database_name = "taranveer-blog"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "taranveer-blog-images"

[[routes]]
pattern = "taranveer.in/api/*"
zone_name = "taranveer.in"

[[routes]]
pattern = "www.taranveer.in/api/*"
zone_name = "taranveer.in"
